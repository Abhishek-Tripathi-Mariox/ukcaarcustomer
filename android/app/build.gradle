apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * React Native configuration. On RN 0.73 the defaults are fine; autolinking is
 * wired up via native_modules.gradle at the bottom of this file.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC). Use JSC by default; Hermes is enabled via gradle.properties.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.ukcaar.customer'
    defaultConfig {
        applicationId 'com.ukcaar.customer'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.0.7"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Credentials live in android/gradle.properties, which must never
            // be committed. If they are missing the build fails loudly rather
            // than silently falling back to the debug key — a debug-signed
            // release is rejected by Play and breaks Firebase phone auth.
            storeFile file(project.property('UKCAAR_RELEASE_STORE_FILE'))
            storePassword project.property('UKCAAR_RELEASE_STORE_PASSWORD')
            keyAlias project.property('UKCAAR_RELEASE_KEY_ALIAS')
            keyPassword project.property('UKCAAR_RELEASE_KEY_PASSWORD')
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Pin the customer DEBUG app's Metro port to 8082 so it can run
            // alongside the driver app (which keeps the default 8081). Both
            // debug apps used to fight over localhost:8081 — whichever
            // project's Metro owned the port fed its bundle to BOTH apps,
            // red-screening the other on any cold start.
            resValue "integer", "react_native_dev_server_port", "8082"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // GIF support via Fresco (required for <Image source={require('*.gif')} />)
    implementation("com.facebook.fresco:animated-gif:3.1.3")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

// react-native-vector-icons: bundle font files into the APK
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
