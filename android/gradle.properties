# Project-wide Gradle settings.
# https://developer.android.com/studio/build/optimize-your-build

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true

# Architectures to build
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture
newArchEnabled=false

# Hermes JS engine
hermesEnabled=true

# ── Release signing (added 2026-08-24) ──
# Do NOT commit this file. Back up the keystore and these passwords — losing
# them means this app can never be updated on Google Play again.
UKCAAR_RELEASE_STORE_FILE=ukcaar-customer-release.keystore
UKCAAR_RELEASE_KEY_ALIAS=ukcaar-customer
UKCAAR_RELEASE_STORE_PASSWORD=WXyaYEWWpj8g5GShaeZMi8jZ
UKCAAR_RELEASE_KEY_PASSWORD=WXyaYEWWpj8g5GShaeZMi8jZ
